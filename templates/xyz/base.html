<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBWB Control Panel</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX Engine for Live Telemetry Swaps -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-[#f4f6f8] text-gray-800 font-sans tracking-tight min-h-screen flex flex-col antialiased">

    <!-- Global Application Navigation -->
    <!-- <header class="bg-[#005f53] text-white px-6 py-4 shadow-md flex justify-between items-center select-none"> -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#005f53] text-white border-b border-gray-200 px-6 py-4 shadow-sm select-none">
    <!-- <nav class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm select-none"> -->
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            
            <!-- Left Brand Segment   SBWB Telemetry Grid-->  
            <div class="flex items-center space-x-3">
                <div class="w-2.5 h-2.5 bg-[#005f53] rounded-full"></div>
                <span class="text-lg font-bold text-white-900 tracking-wider uppercase">Waste Management Administration</span>
            </div>

            <!-- Right Segment Controls -->
            {% if user.is_authenticated %}
            <div class="flex items-center space-x-6 text-xs uppercase tracking-wider font-bold">
                <a href="{% url 'dashboard_home' %}" class="text-white-500 hover:text-gray transition duration-150">
                    Dashboard
                </a>
                <a href="{% url 'system_status' %}" class="text-white-500 hover:text-gray transition duration-150">
                    Status
                </a>
                
                <span class="h-4 w-px bg-gray-200"></span>
                
                <!-- <form action="{% url 'logout' %}" method="post" class="inline m-0">
                    {% csrf_token %}
                    <button type="submit" class="text-red-600 hover:text-red-700 transition duration-150">
                        LOGOUT
                    </button>
                </form> -->

                {% if user.is_authenticated %}
                <span class="text-gray-200">Operator: <strong class="text-white">{{ user.username }}</strong></span>
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-r-200 hover:text-white transition font-medium text-xs uppercase tracking-wider">Logout</button>
                </form>
                {% endif %}

            </div>
            {% endif %}
            
        </div>
    </nav>

    <!-- Content Workspace -->
    <main id="main-content" class="flex-grow flex flex-col pt-20">
    <!-- <main id="main-content" class="flex-grow flex flex-col"> -->
        {% block content %}{% endblock %}
    </main>

    <!-- Universal Footer Layer -->
    <footer class="bg-white border-t border-gray-200 py-4 px-6 text-[11px] font-semibold text-gray-400 text-center tracking-wider uppercase select-none">
        SBWB Hardware Integration Layer &copy; 2026 Engine Active.
    </footer>

</body>
</html>
